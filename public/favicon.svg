<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="16タイプ研究室">
  <title>16タイプ研究室</title>
  <!--
    16タイプを4×4のグリッドで表す。
    各行が1グループ（分析家・外交官・番人・探検家）で、色は data/mbti-types.ts の GROUPS と対応。
    ラスタ画像ではなくSVGなので、どのサイズでも輪郭が崩れない。
  -->
  <g fill="#3d4f7c">
    <circle cx="5.5" cy="5.5" r="2.8" />
    <circle cx="12.5" cy="5.5" r="2.8" />
    <circle cx="19.5" cy="5.5" r="2.8" />
    <circle cx="26.5" cy="5.5" r="2.8" />
  </g>
  <g fill="#8f5464">
    <circle cx="5.5" cy="12.5" r="2.8" />
    <circle cx="12.5" cy="12.5" r="2.8" />
    <circle cx="19.5" cy="12.5" r="2.8" />
    <circle cx="26.5" cy="12.5" r="2.8" />
  </g>
  <g fill="#4a6f57">
    <circle cx="5.5" cy="19.5" r="2.8" />
    <circle cx="12.5" cy="19.5" r="2.8" />
    <circle cx="19.5" cy="19.5" r="2.8" />
    <circle cx="26.5" cy="19.5" r="2.8" />
  </g>
  <g fill="#a8763e">
    <circle cx="5.5" cy="26.5" r="2.8" />
    <circle cx="12.5" cy="26.5" r="2.8" />
    <circle cx="19.5" cy="26.5" r="2.8" />
    <circle cx="26.5" cy="26.5" r="2.8" />
  </g>
</svg>
