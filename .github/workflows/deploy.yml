name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 未来日付の記事をその日に公開するための定期ビルド。
  # 静的サイトなのでビルドしないと反映されない（毎日 00:10 JST）。
  schedule:
    - cron: '10 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ。進行中のものは走り切らせる。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
